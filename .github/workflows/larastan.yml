name: Laravel

on:
  push:
    branches: [ "production-aws" ]
  pull_request:
    branches: [ "production-aws" ]

jobs:
  laravel-tests:

    runs-on: ubuntu-latest

    steps:
    - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
      with:
        php-version: '8.0'
    - uses: actions/checkout@v4
    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"
    - name: 📦 Install dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: 🛠️ Set up Laravel environment
      run: |
        cp .env.example .env
        php artisan key:generate

    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache
    - name: Execute tests (Unit and Feature tests) via PHPUnit/Pest
      env:
        DB_CONNECTION: mysql
        DB_HOST: db-eduall-mysql.cn0aqgm44flq.ap-southeast-3.rds.amazonaws.com
        DB_PORT: 3306
        DB_DATABASE: stag_crm
        DB_USERNAME: admin
        DB_PASSWORD: GjAWJOAePqPXTtFSAJNH
      run: php artisan test

    - name: 🧠 Generate IDE Helper (model metadata)
      run: php artisan ide-helper:models --write

    - name: 🔍 Run Larastan (PHPStan)
      run: vendor/bin/phpstan analyse
